---
# Fish shell configuration module
# Provides Fish shell configuration, plugins, and functions
#
# Post-deployment: After running the playbook, log into a fish shell and run
# `fisher update` to install the plugins listed in files/.config/fish/fish_plugins.
# Then run the `tide configure --auto ...` command from README.md to set the
# prompt baseline. See QUICKSTART.md for the full post-deployment sequence.

homebrew_packages:
  - fish
  - fisher

stow_dirs:
  - fish

register_shell: fish
