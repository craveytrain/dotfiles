---
# Main deployment playbook for dotfiles. Run it through ./deploy.
- name: Deploy dotfiles
  hosts: localhost
  tags:
    - dotfiles
  vars:
    dotmodules:
      root: '{{ playbook_dir }}/../modules'
      install:
        - git
        - fonts
        - 1password
        - shell
        - fish
        - zsh
        - dev-tools
        - editor
        - ghostty
        - tmux
        - claude
  roles:
    - role: dotmodules
  post_tasks:
    - name: Point this repo's git hooks at .githooks (pre-commit scrub-check for settings.json)
      community.general.git_config:
        repo: '{{ playbook_dir }}/..'
        scope: local
        name: core.hooksPath
        value: .githooks
